# Scrape the cached Prometheus snapshot. See docs/monitoring/METRICS.md.
# Prometheus selects text/plain. The web Monitor keeps the JSON response.
scrape_configs:
  - job_name: strata
    metrics_path: /metrics
    scrape_interval: 15s
    # with an API key (strata-<model>.json "api_key" or --api-key): sent as a bearer token
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/strata-api-key
    static_configs:
      - targets: ["127.0.0.1:8080"]
